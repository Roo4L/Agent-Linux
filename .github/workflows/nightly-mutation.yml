name: nightly-mutation
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # (The TypeScript `stryker` mutation job was removed at the Rust cutover — the
  # TS CLI it mutated is gone; the Rust mutation score is `rust-mutants` below.)
  # TEST-02: full-WORKSPACE cargo-mutants score, sharded across four runners.
  # Advisory: a surviving mutant warns rather than blocking. The ENFORCING merge
  # gate is the per-PR --in-diff step in test.yml's rust job; this job reports
  # the full score that bounded run cannot, so a module nobody edits is still
  # re-scored.
  rust-mutants:
    runs-on: ubuntu-24.04
    # NOT continue-on-error. Advisory means "a surviving mutant warns"; it does
    # NOT mean "a broken gate is fine". The previous version combined
    # continue-on-error with `|| echo "::warning::"`, so an invalid flag pair
    # (`--in-place` with `--jobs`, which cargo-mutants rejects) reported a
    # mutation score for a run that generated zero mutants. scripts/mutation-gate.sh
    # draws its verdict from mutants.out/outcomes.json precisely so "nothing
    # survived" and "nothing ran" cannot be confused.
    strategy:
      fail-fast: false
      matrix:
        # Sharding, not --jobs: cargo-mutants refuses `--in-place --jobs N`, and
        # --in-place is required (see the gate step). --shard IS compatible, and
        # one shard per runner gives real parallelism with a private checkout.
        #
        # ZERO-INDEXED: cargo-mutants rejects `k/n` unless k < n. This read
        # `[1, 2, 3, 4]`, so shard 4/4 errored on every nightly run while shard
        # 0's mutants were never dispatched — 245 of the workspace's 978, a
        # quarter of it, silently unscored, with the gate unable to notice
        # because advisory mode tolerates a subset by design. MUT-20 now loops
        # these exact values through the tool so the matrix cannot drift again.
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - name: Skip if rust/ absent
        id: guard
        run: |
          if [ -f rust/Cargo.toml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "rust/Cargo.toml absent — skipping rust-mutants (advisory)"
          fi
      - name: Install Rust toolchain
        if: steps.guard.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@stable
      # Pinned + --locked: same version as the per-PR gate so the nightly
      # full-workspace score and the merge gate share one mutation set.
      - name: Install cargo-mutants (pinned)
        if: steps.guard.outputs.ready == 'true'
        run: cargo install --locked --version 27.1.0 cargo-mutants
      # --in-place is REQUIRED: two agentlinux-core tests read sibling files
      # under plugin/catalog/, outside the rust/ workspace, so cargo-mutants'
      # default copy-tree isolation fails the baseline. Safe here — the runner
      # checkout is disposable and cargo-mutants restores each mutation.
      - name: Full-workspace mutation score (shard ${{ matrix.shard }}/4)
        if: steps.guard.outputs.ready == 'true'
        working-directory: rust
        run: |
          ../scripts/mutation-gate.sh advisory \
            --in-place --shard ${{ matrix.shard }}/4 --minimum-test-timeout 20
      # The score is worthless if nobody can read it: keep the surviving-mutant
      # list so a nightly warning can be acted on instead of just observed.
      - name: Upload mutants.out
        if: always() && steps.guard.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: rust/mutants.out/
          if-no-files-found: warn
