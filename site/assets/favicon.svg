<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges">
  <style>
    .w { fill: #ffffff; }
    .e { fill: #111111; }
    .r { fill: #888888; }
    .wl { fill: #4a4a4a; }
    .rf { fill: #aaaaaa; }
  </style>
  <!-- Pixel-art house, same motif as house-mascot.svg -->
  <!-- Chimney -->
  <rect class="r" x="10" y="1" width="2" height="3"/>
  <!-- Roof triangle -->
  <rect class="rf" x="7" y="3" width="2" height="1"/>
  <rect class="rf" x="6" y="4" width="4" height="1"/>
  <rect class="rf" x="5" y="5" width="6" height="1"/>
  <rect class="rf" x="4" y="6" width="8" height="1"/>
  <rect class="rf" x="3" y="7" width="10" height="1"/>
  <rect class="rf" x="2" y="8" width="12" height="1"/>
  <!-- Eaves -->
  <rect class="r" x="1" y="9" width="14" height="1"/>
  <!-- Walls -->
  <rect class="wl" x="2" y="10" width="12" height="5"/>
  <rect class="r" x="2" y="10" width="1" height="5"/>
  <rect class="r" x="13" y="10" width="1" height="5"/>
  <rect class="r" x="2" y="10" width="12" height="1"/>
  <!-- Windows -->
  <rect class="w" x="3" y="11" width="2" height="2"/>
  <rect class="w" x="11" y="11" width="2" height="2"/>
  <!-- Door -->
  <rect class="e" x="7" y="13" width="2" height="2"/>
  <rect class="r" x="8" y="14" width="1" height="1"/>
</svg>
