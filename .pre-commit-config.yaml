# .pre-commit-config.yaml
# Copied verbatim from docs/HARNESS.md §1.2 — authoritative spec.
# Covers: bash (shellcheck + shfmt), JSON (catalog schema), gitleaks, and repo guards.
# Runs locally on `pre-commit run --all-files` and in .github/workflows/test.yml.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: [--severity=warning, --shell=bash, --external-sources]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.9.0-1
    hooks:
      - id: shfmt
        args: [-i, '2', -ci, -bn]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      # SEC-05 (v0.4.0 Phase 8): block secret-shaped strings on every commit.
      # Configured via .gitleaks.toml at repo root (extends the upstream default
      # rule set + allowlists .planning/*.md per ADR-014).
      - id: gitleaks

  - repo: local
    hooks:
      - id: catalog-schema-validate
        name: Validate catalog.json against schema
        # jq structural gate (replaced the deleted TS ajv validator at the Rust
        # cutover). Full JSON-Schema validation is the Rust schemars drift-check
        # (`cargo test -p agentlinux-core schema`, TEST-03) in the rust CI job.
        entry: product/scripts/check-catalog-schema.sh
        language: system
        files: ^product/plugin/catalog/(catalog|agents/.*/recipe)\.json$
        pass_filenames: false

      # AL-25: shift the build-release.sh version-lock gate from release-time to
      # commit-time. Fails fast on drift between product/plugin/catalog/catalog.json
      # ::version and product/rust/crates/agentlinux/Cargo.toml [package] version (the
      # post-cutover two-way lock). Pure bash plus sed; no jq dependency.
      - id: check-version-lockstep
        name: Check catalog.json/Cargo.toml version lockstep
        entry: product/scripts/check-version-lockstep.sh
        language: system
        files: ^product/(plugin/catalog/catalog\.json|rust/crates/agentlinux/Cargo\.toml)$
        pass_filenames: false

      # Phase 20 (PAR-01 / EL-08): cross-suite distro-leak guard. Fails if any
      # bats test/helper inlines an EXECUTED Debian-hardcoded package operation
      # (dpkg-query / deb.nodesource / apt-get <subcommand>) instead of routing
      # through product/tests/bats/helpers/distro.bash — the 52-agt02-brownfield-gate
      # `dpkg-query: command not found` class that broke on AlmaLinux 9. The
      # script scans the whole bats tree (Plan 20-02's manual grep covered only
      # brownfield.bash, which is why the sibling-file leak survived).
      - id: check-distro-leak
        name: Check bats suite for inline Debian package operations (EL9 leak)
        entry: product/scripts/check-distro-leak.sh
        language: system
        files: ^product/tests/bats/([^/]+\.bats|helpers/[^/]+\.bash)$
        pass_filenames: false
      - id: sync-codex-agents
        name: Check .codex/agents/ is in sync with .claude/agents/ reviewer roles
        entry: scripts/sync-codex-agents.sh --check
        language: system
        files: ^(\.claude/agents/[^/]+\.md|\.codex/agents/[^/]+\.toml|scripts/sync-codex-agents\.sh)$
        pass_filenames: false
