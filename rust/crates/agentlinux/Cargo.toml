[package]
name = "agentlinux"
# The USER-FACING product version (mirrors plugin/cli/package.json → CLI-01),
# NOT the internal v0.4.0 GSD/milestone label. `agentlinux --version` emits
# CARGO_PKG_VERSION, and bats CLI-01 derives the expected string from
# package.json (`jq -r .version` → 0.3.6). Like-for-like invariant: nothing
# user-observable changes in the TS→Rust port, so the shipped version is
# unchanged. A future product renumber bumps package.json and this together.
version = "0.3.6"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "AgentLinux CLI binary (static musl). Thin adapter over agentlinux-core."

[[bin]]
name = "agentlinux"
path = "src/main.rs"

[dependencies]
agentlinux-core = { path = "../agentlinux-core" }
# clap 4.6 (derive) — the Commander → clap arg-parse port (VERB-01). Package
# Legitimacy Gate: verdict OK (source-backed, high-download, no postinstall).
clap = { version = "4.6", features = ["derive"] }
