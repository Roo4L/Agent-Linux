[package]
name = "agentlinux-core"
version = "0.4.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pure, I/O-free core logic for the AgentLinux CLI (classify, divergence, semver shim)."

[dependencies]
# Pinned exactly per RESEARCH §"node-semver → Rust semver Parity" — 1.0.28 is the
# empirically-validated version whose divergences the semver_shim reproduces.
# DO NOT bump: the semver_shim reproduces THIS version's divergences (TEST-04).
semver = "=1.0.28"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
# Staged in Plan 54-01 so Plan 54-02 (schema-gen, TEST-03) touches no shared
# manifest. The `#[derive(JsonSchema)]` on the catalog types lands in Plan 02;
# an unused dep does not fail the build, so carrying it now is inert.
schemars = { version = "1.2.2", features = ["derive"] }

[dev-dependencies]
# TEST-01: property tests + shrinking + regression persistence over the pure core.
proptest = "1.11"
# TEST-04: the catalog-driven golden case deserializes plugin/catalog/catalog.json.
# Also used by Plan 54-02's schema-gen drift-check (staged here, dev-only).
serde_json = "1"
