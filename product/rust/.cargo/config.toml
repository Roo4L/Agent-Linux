# Static musl build config (RUST-01). The x86_64-unknown-linux-musl target links
# musl statically by default for a pure-Rust dep tree; crt-static + the musl-gcc
# linker are set belt-and-braces. The real gate is the `ldd` assertion in CI/verify.
[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"
rustflags = ["-C", "target-feature=+crt-static"]
